# GitHub Actions workflow - 透過 API 創建 issue
name: Create Quote Issue

on:
  repository_dispatch:
    types: [create-quote-issue]

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { quote, author } = context.payload.client_payload;
            const issueTitle = `語錄：${quote.substring(0, 50)}${quote.length > 50 ? '...' : ''}`;
            const issueBody = `**語錄內容：** ${quote}\n\n**投稿者：** ${author}\n\n---\n*此語錄由網頁表單自動提交*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['quote']
            });
