<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dan Hsu 經典語錄</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Dan Hsu 經典語錄</h1>
        <div class="input-area">
            <input type="text" id="quoteInput" placeholder="輸入語錄">
            <input type="text" id="authorInput" placeholder="投稿人姓名">
            <button id="submitQuote">提交語錄</button>
        </div>
        <div class="quotes-display">
            <h2>過去的語錄</h2>
            <ul id="quotesList"></ul>
        </div>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
